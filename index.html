<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面外壳的文案由 app.js 的 applyChrome() 按 data-i18n 填充,这里写的是英文默认值 -->
  <title>SwiftLab · see an app take shape</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">🧪</div>
      <div>
        <div class="logo-name">SwiftLab</div>
        <div class="logo-sub" data-i18n="tagline">See an app take shape</div>
      </div>
    </div>

    <div class="lang-seg" role="group" aria-label="Language" data-i18n-label="langAria">
      <button type="button" class="lang-btn on" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
    </div>

    <nav class="stops" id="stops"></nav>

    <div class="side-foot">
      <div class="progress-card">
        <div class="progress-label" data-i18n="progressLabel">Your progress</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-num" id="progressNum">0 / 4 done</div>
      </div>
      <div class="side-note" data-i18n="sideNote">Sister site: AgentLab · see inside an AI agent</div>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <div class="popover-mask" id="popMask"></div>
  <div class="popover" id="popover"></div>
  <canvas id="confetti"></canvas>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
